<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Herbiveda</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/home.css">
  <link rel="stylesheet" href="./assets/css/modernization.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body id="top">
  <main class="section">
    <div class="container" style="max-width:760px;text-align:center;">
      <a href="./index.html" class="logo">Herbi<span class="span">veda</span></a>
      <div class="conversion-card" style="margin-block-start:30px;">
        <p class="section-subtitle">Enquiry Received</p>
        <h1 class="h2 card-title">Thank you for contacting Herbiveda.</h1>
        <p class="card-text" style="margin-block:18px 25px;">Your enquiry has been received. Our team will review your request and contact you within 24–48 hours.</p>
        <a href="./index.html" class="btn btn-primary">Return to Herbiveda</a>
      </div>
    </div>
  </main>

  <a class="wa-float" data-whatsapp-chat href="https://wa.me/918076757022?text=Hi%20Herbiveda%2C%20I%20have%20a%20question" target="_blank" rel="noopener noreferrer" aria-label="Chat with Herbiveda on WhatsApp">
    <ion-icon name="logo-whatsapp" aria-hidden="true"></ion-icon>
  </a>

  <script>
    (function () {
      var link = document.querySelector('[data-whatsapp-chat]');
      if (!link) return;
      var path = window.location.pathname.toLowerCase();
      var params = new URLSearchParams(window.location.search);
      var topic = params.get('topic') || params.get('product') || '';
      var routes = [
        [/retreat/, 'Hi Herbiveda, I am interested in your Panchakarma retreat. Please share the programme details, dates and availability.'],
        [/trade|wholesale|partner/, 'Hi Herbiveda, I am interested in wholesale or partnership enquiries. Please share your pricing and next steps.'],
        [/product-details/, 'Hi Herbiveda, I have a question about ' + (topic || 'an Ayurvedic product') + '. Please share more details.'],
        [/shop/, 'Hi Herbiveda, I have a question about your Ayurvedic herbs and products.'],
        [/contact/, 'Hi Herbiveda, I would like to enquire about your courses, products or retreats.']
      ];
      var message = 'Hi Herbiveda, I have a question about your Ayurveda offerings.';
      for (var i = 0; i < routes.length; i += 1) {
        if (routes[i][0].test(path)) { message = routes[i][1]; break; }
      }
      if (topic && !/product-details/.test(path)) message += ' My topic is: ' + topic + '.';
      var destination = 'https://wa.me/918076757022?text=' + encodeURIComponent(message);
      link.href = destination;
      link.addEventListener('click', function () {
        var data = {
          event_category: 'engagement',
          event_label: path || '/',
          page_path: path || '/',
          link_url: destination,
          utm_source: params.get('utm_source') || 'website',
          utm_medium: params.get('utm_medium') || 'whatsapp',
          utm_campaign: params.get('utm_campaign') || ''
        };
        if (typeof window.gtag === 'function') window.gtag('event', 'whatsapp_click', data);
        else if (window.dataLayer && typeof window.dataLayer.push === 'function') {
          window.dataLayer.push(Object.assign({ event: 'whatsapp_click' }, data));
        }
      });
    })();

    document.querySelectorAll('[data-whatsapp-inline]').forEach(function (link) {
      link.addEventListener('click', function () {
        var path = window.location.pathname.toLowerCase();
        var data = { event_category: 'engagement', event_label: path, page_path: path, link_url: link.href };
        if (typeof window.gtag === 'function') window.gtag('event', 'whatsapp_click', data);
        else if (window.dataLayer && typeof window.dataLayer.push === 'function') {
          window.dataLayer.push(Object.assign({ event: 'whatsapp_click' }, data));
        }
      });
    });
  </script>
</body>
</html>
