  <circle cx="60" cy="60" r="44" fill="none" stroke="#fff" stroke-width="1" opacity="0.7"/>
  <!-- Flask -->
  <g fill="#fff">
    <path d="M52 38 h16 v10 l10 28 a12 12 0 0 1-12 12 h-12 a12 12 0 0 1-12-12 l10-28 z"/>
