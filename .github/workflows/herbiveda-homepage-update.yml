name: Herbiveda Section Typography Preview

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update section subtitle styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          css = Path('assets/css/home.css')

          html = index.read_text(encoding='utf-8')
          stylesheet = css.read_text(encoding='utf-8')

          # Remove only the visible heading text; preserve section content and layout.
          html = html.replace(
              '<h2 class="h2 section-title">Trusted Sources &amp; Partners</h2>',
              ''
          )
          html = html.replace(
              '<h2 class="h2 section-title">Experiences from the Herbiveda Community</h2>',
              ''
          )

          marker = '/*-----------------------------------*\\\n  #HERBIVEDA SECTION SUBTITLES\n\\*-----------------------------------*/'

          if marker not in stylesheet:
              stylesheet += r'''

/*-----------------------------------*\
  #HERBIVEDA SECTION SUBTITLES
\*-----------------------------------*/

/* Editorial kicker style for Herbiveda section subtitles. */
.section-subtitle {
  color: var(--emerald);
  font-family: var(--ff-roboto);
  font-size: 1.2rem;
  font-weight: var(--fw-700);
  font-style: normal;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  margin-block-end: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.section-subtitle::before,
.section-subtitle::after {
  content: "";
  width: 28px;
  height: 1px;
  background-color: var(--emerald);
  opacity: 0.5;
}

.section-subtitle + .section-title {
  margin-block-end: 14px;
}

@media (max-width: 479px) {
  .section-subtitle {
    font-size: 1.1rem;
    letter-spacing: 1.7px;
    gap: 9px;
  }

  .section-subtitle::before,
  .section-subtitle::after {
    width: 20px;
  }
}
'''

          index.write_text(html, encoding='utf-8')
          css.write_text(stylesheet, encoding='utf-8')
          PY

      - name: Commit preview changes and remove updater
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/herbiveda-homepage-update.yml
          git add index.html assets/css/home.css .github/workflows/herbiveda-homepage-update.yml
          git diff --cached --quiet || git commit -m "Refine Herbiveda section subtitle styling"
          git push origin HEAD:master
